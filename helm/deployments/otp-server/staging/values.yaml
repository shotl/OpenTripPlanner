app:
  replicas: 1

  command: ["--max-memory", "3", "serve"]

  # Staging environment specific environment vars
  environment: {}

  scheduling:
    preferSpotInstances: true

  # The limit leaves 1Gi above the 3G heap (see production/values.yaml). Requests from 2 weeks
  # of staging (2026-11, ~1.1Gi peak; ADR 0012).
  resources:
    limits:
      memory: 4Gi
    requests:
      cpu: 10m
      memory: 1392Mi

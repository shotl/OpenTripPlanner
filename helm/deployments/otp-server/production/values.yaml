app:
  replicas: 1

  command: ["--max-memory", "3", "serve"]

  # Production environment specific environment vars
  environment: {}

  # --max-memory 3 is the JVM heap (-Xmx3G, script/entrypoint.sh): the limit leaves 1Gi above it
  # for metaspace, threads and native memory; at 3Gi the heap alone could fill the container.
  # Requests from 2 weeks of production (2026-11, ADR 0012): ~1.9Gi peak; 250m covers startup,
  # the CPU peak, after every daily graph rebuild.
  resources:
    limits:
      memory: 4Gi
    requests:
      cpu: 250m
      memory: 2336Mi

  # On-demand in production (a single replica). The memory pool is folded into general
  # (ADR 0012 §4b).
  nodeSelector:
    karpenter.sh/capacity-type: on-demand

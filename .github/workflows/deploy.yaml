name: Build & Deploy
on:
  push:
    branches:
      - feature/drt-mode # Treat this branch as staging for this forked repo
    tags:
      - v*

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  APPLICATIONS_FILE_PATH: helm
  GITHUB_CONTEXT: ${{ toJson(github) }}
  GH_PAT: ${{ secrets.SHOTLBOT_SHOTOOL_PAT }}
  VALUES_REPO_NAME: platform-deployments
  VALUES_GH_REPO_BRANCH: main
  ARGOCD_PROJECT: shotl
  IMAGE_REPOSITORY: otp
  STAGING_SLACK_WEBHOOK_URL: ${{ secrets.STAGING_DEPLOYMENT_SLACK_WEBHOOK_URL }}
  PRODUCTION_SLACK_WEBHOOK_URL: ${{ secrets.PRODUCTION_DEPLOYMENT_SLACK_WEBHOOK_URL }}
  LOG_LEVEL: info

jobs:
  # ───────────────────────────────────────────────────────────────
  # 1. Determine target environment from the Git ref
  # ───────────────────────────────────────────────────────────────
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      env_short: ${{ steps.resolve.outputs.env_short }}
      app_version: ${{ steps.resolve.outputs.app_version }}
      is_build_tag: ${{ steps.resolve.outputs.is_build_tag }}
    steps:
      - name: Resolve deployment target
        id: resolve
        run: |
          if [[ "${GITHUB_REF}" == */feature/drt-mode ]]; then
            echo "environment=Staging"  >> "$GITHUB_OUTPUT"
            echo "env_short=stg"        >> "$GITHUB_OUTPUT"
            echo "app_version=stg-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
            echo "is_build_tag=false" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "environment=Production" >> "$GITHUB_OUTPUT"
            echo "env_short=prod"         >> "$GITHUB_OUTPUT"
            echo "app_version=${TAG}"     >> "$GITHUB_OUTPUT"
            if [[ "${TAG}" == *"-build" ]]; then
              echo "is_build_tag=true"  >> "$GITHUB_OUTPUT"
            else
              echo "is_build_tag=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::error::Unsupported ref '${GITHUB_REF}' — expected feature/drt-mode branch or tag"
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────
  # 2. Build (optional) & deploy via shotool
  # ───────────────────────────────────────────────────────────────
  deploy:
    needs: resolve-env
    runs-on: ubuntu-latest
    container:
      image: 177029646271.dkr.ecr.eu-west-1.amazonaws.com/shotool:v3.0.1
      credentials:
        username: AWS
        password: ${{ secrets.AWS_ECR_PASSWORD }}
    environment: ${{ needs.resolve-env.outputs.environment }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ needs.resolve-env.outputs.environment }}
      cancel-in-progress: false
    env:
      # ArgoCD / Kubernetes (sourced from org/repo variables) -----
      ARGOCD_SERVER: ${{ needs.resolve-env.outputs.environment == 'Staging' && vars.ARGOCD_SERVER_STAGING || vars.ARGOCD_SERVER_PRODUCTION }}
      EKS_CLUSTER_NAME: ${{ needs.resolve-env.outputs.environment == 'Staging' && vars.EKS_CLUSTER_NAME_STAGING || vars.EKS_CLUSTER_NAME_PRODUCTION }}
      EKS_CLUSTER_ALIAS: ${{ needs.resolve-env.outputs.environment == 'Staging' && vars.EKS_CLUSTER_ALIAS_STAGING || vars.EKS_CLUSTER_ALIAS_PRODUCTION }}
      # Application ----------------------------------------------------
      ENVIRONMENT: ${{ needs.resolve-env.outputs.env_short == 'stg' && 'staging' || 'production' }}
      ENV_SHORT: ${{ needs.resolve-env.outputs.env_short }}
      APP_VERSION: ${{ needs.resolve-env.outputs.app_version }}
      IS_BUILD_TAG: ${{ needs.resolve-env.outputs.is_build_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Login to ECR
        if: env.IS_BUILD_TAG == 'true'
        uses: aws-actions/amazon-ecr-login@v2
        with:
          region: ${{ vars.AWS_REGION }}

      - name: Build image and run OTP graph build
        if: env.IS_BUILD_TAG == 'true'
        run: |
          # Build the image with the tag
          shotool build -t otp:${{ env.APP_VERSION }}

          # Run OTP entrypoint with graph build in the newly built image
          docker run --rm \
            -v /app/build:/app/build \
            -e ENVIRONMENT=production \
            -e AWS_REGION=${{ vars.AWS_REGION }} \
            -e AWS_ACCESS_KEY_ID=${{ env.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ env.AWS_SECRET_ACCESS_KEY }} \
            ${{ env.AWS_REGISTRY }}/otp:${{ env.APP_VERSION }} \
            --max-memory 6 build \
            --osm-file-name restrictions

      - name: Deploy
        if: env.IS_BUILD_TAG == 'false'
        run: |
          ARGS="--app-version ${{ env.APP_VERSION }} --build"
          shotool deploy ${ARGS}

      - name: Deploy (post-build)
        if: env.IS_BUILD_TAG == 'true'
        run: |
          ARGS="--app-version ${{ env.APP_VERSION }}"
          shotool deploy ${ARGS}
